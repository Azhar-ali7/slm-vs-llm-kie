# =============================================================================
# SLM vs LLM for Key Information Extraction — single source of truth.
# No magic constants in code: everything the runner needs lives here.
# =============================================================================

seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  runs_jsonl: results/runs.jsonl
  summary_csv: results/summary.csv
  test_set: results/test_set_20.json
  report_md: results/REPORT.md
  plots_dir: results
  report_dir: report

# ----------------------------------------------------------------------------
# Datasets — pluggable. Add a loader in src/data/loaders.py + an entry here.
# ----------------------------------------------------------------------------
datasets:
  sroie:
    name: sroie
    schema: config/schemas/sroie.json
    raw_dir: data/raw/sroie
    complexity: simple        # 4 fields, receipts
  kleister_charity:
    name: kleister_charity
    schema: config/schemas/kleister.json
    raw_dir: data/raw/kleister_charity
    complexity: complex       # 8 fields, financial reports

# 20-doc reproducible test set: how many from each dataset (fixed by seed).
test_set:
  total: 20
  per_dataset:
    sroie: 10
    kleister_charity: 10

# ----------------------------------------------------------------------------
# Conditions (experiment grid)
# ----------------------------------------------------------------------------
conditions:
  shot_modes: [zero_shot, few_shot]
  input_variants: [lines_only, lines_plus_kv]
  few_shot_k: 2            # examples drawn from TRAIN split, never the test set
  n_samples: 1            # repeats per cell; raise to 2 only after a clean pilot
  max_input_lines: 120    # cap document lines in the prompt (long Kleister reports
                          # -> bounded context for small local models & Azure cost)

# ----------------------------------------------------------------------------
# Models — locked set. type: local (Ollama, free) | api (Azure, billed).
# Ordered smallest -> largest so an 8GB OOM on a big model never blocks the
# small-model results already written. params_b is used for the F1-vs-size plot.
# ----------------------------------------------------------------------------
models:
  - id: smollm2-360m
    type: local
    tag: smollm2:360m
    params_b: 0.36
  - id: qwen2.5-0.5b
    type: local
    tag: qwen2.5:0.5b
    params_b: 0.5
  - id: llama3.2-1b
    type: local
    tag: llama3.2:1b
    params_b: 1.0
  - id: gemma2-2b
    type: local
    tag: gemma2:2b
    params_b: 2.0
  # phi4-mini & mistral run on Azure AI Foundry serverless (no 8GB pressure).
  # Requires AZURE_FOUNDRY_ENDPOINT + AZURE_FOUNDRY_API_KEY in .env and the
  # models deployed in your Foundry project (see api.foundry.models below).
  # Mid arm runs on a DigitalOcean GPU droplet via Ollama (target it with
  # OLLAMA_HOST=http://<droplet-ip>:11434) — same constrained-decoding stack as
  # the small models. foundry_model kept for reference if you switch back.
  - id: phi4-mini
    type: local
    tag: phi4-mini
    foundry_model: phi4-mini
    params_b: 3.8
  - id: mistral-7b
    type: local
    tag: mistral
    foundry_model: mistral
    params_b: 7.0
  # Large arm = frontier commercial models, served via DigitalOcean serverless
  # inference (pay-per-token on the $200 credit; no GPU droplet, no idle billing).
  - id: frontier-llm
    type: do_serverless
    do_model: frontier-llm            # -> api.digitalocean.models.frontier-llm (GPT-4o)
    params_b: null                    # plotted separately (size unknown/closed-proxy)
  - id: large-open-llm
    type: do_serverless
    do_model: large-open-llm          # -> api.digitalocean.models.large-open-llm (Claude Haiku 4.5)
    params_b: null                    # closed-proxy; size unknown

# ----------------------------------------------------------------------------
# Local model runtime (Ollama on M1 / 8GB unified memory)
# ----------------------------------------------------------------------------
ollama:
  host: http://localhost:11434
  temperature: 0.0
  num_predict: 512          # cap output tokens
  seed: 42
  keep_alive: "5m"          # keep model loaded across its batch (small models);
                            # set 0 to unload after each call (safer for 7B on 8GB)
  structured_output: true   # constrained JSON decoding (forces valid JSON w/ all
                            # fields) — fixes parse failures, boosts small-model F1
  request_timeout_s: 600    # big models on 8GB can be slow; be generous
  mem_sample_interval_s: 0.25   # how often to poll ollama-server RSS during a call

# ----------------------------------------------------------------------------
# API models — ACTIVE cloud path: DigitalOcean serverless inference
# (Azure / OpenRouter blocks kept below for reference but unused.)
# ----------------------------------------------------------------------------
api:
  provider: azure_openai    # azure_openai | anthropic | openai (only affects type:api)

  # --- DigitalOcean serverless inference (ACTIVE large arm) ----------------
  # OpenAI-compatible (https://inference.do-ai.run/v1), single "model access
  # key" (env DO_INFERENCE_KEY, created in DO Control Panel). Pay-per-token on
  # the $200 credit — no GPU droplet, no idle/hourly billing. Hosts GPT-4o and
  # Claude Haiku 4.5 directly. Whole-grid (80 cells) cost ~$1 total.
  digitalocean:
    base_url: "https://inference.do-ai.run/v1"
    api_key_env: DO_INFERENCE_KEY
    temperature: 0.0
    max_tokens: 512
    request_timeout_s: 60
    models:
      # model = DigitalOcean catalog model ID. Prices USD per 1M tokens
      # (set from the DO pricing page; used only for the cost plot).
      frontier-llm:
        model: "openai-gpt-4o"
        price_in: 2.50
        price_out: 10.00
      large-open-llm:
        model: "anthropic-claude-haiku-4.5"
        price_in: 1.00
        price_out: 5.00

  # --- Azure OpenAI (GPT models only) -------------------------------------
  azure:
    endpoint_env: AZURE_OPENAI_ENDPOINT
    api_key_env: AZURE_OPENAI_API_KEY
    api_version: "2024-10-21"
    temperature: 0.0
    max_tokens: 512
    request_timeout_s: 60
    models:
      # deployment = your Azure OpenAI deployment name. Prices USD per 1M tokens.
      # CHEAP-TIER DEFAULT: frontier = gpt-4o-mini. Swap to a gpt-4o deployment
      # (price 2.50 / 10.00) if you want a stronger frontier model.
      frontier-llm:
        deployment: "<your-gpt-4o-mini-deployment>"
        price_in: 0.15
        price_out: 0.60

  # --- Azure AI Foundry serverless (Phi / Mistral / Llama / …) -------------
  # Different service from Azure OpenAI: uses an endpoint+key from a Foundry
  # serverless deployment. Set the model names + your endpoint/key (env below).
  # CHEAP-TIER DEFAULTS chosen (Phi-4-mini, Ministral-8B, Llama-3.3-70B).
  foundry:
    endpoint_env: AZURE_FOUNDRY_ENDPOINT      # e.g. https://<res>.services.ai.azure.com/models
    api_key_env: AZURE_FOUNDRY_API_KEY
    api_version: "2024-05-01-preview"
    temperature: 0.0
    max_tokens: 512
    request_timeout_s: 60
    models:
      phi4-mini:
        model: "Phi-4-mini-instruct"
        price_in: 0.07
        price_out: 0.23
      mistral:                       # cheap tier — avoid "Mistral Small/Large"
        model: "Ministral-8B"
        price_in: 0.10
        price_out: 0.10
      large-open-llm:
        model: "Llama-3.3-70B-Instruct"
        price_in: 0.59
        price_out: 0.79
      # Per-model endpoint/key override (if a deployment has its own URL+key):
      #   phi4-mini: {model: ..., endpoint_env: PHI4_ENDPOINT, api_key_env: PHI4_KEY, ...}

  # --- OpenRouter (ACTIVE cloud path) -------------------------------------
  # One OpenAI-compatible key (OPENROUTER_API_KEY) for every cloud model.
  # CHEAP-TIER DEFAULTS verified live (USD per 1M tokens). Swap `model` for a
  # ":free" slug (e.g. meta-llama/llama-3.3-70b-instruct:free) to run at $0 —
  # free models have lower rate limits.
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.0
    max_tokens: 512
    request_timeout_s: 60
    title: "slm-vs-llm-kie"
    models:
      # LARGE ARM = frontier commercial models (the "large LLM" comparison),
      # both served via OpenRouter's OpenAI-compatible API. Needs >=$10 credit
      # on the account (also lifts the free-tier ~50 req/day rate limit).
      # Prices are USD per 1M tokens; whole-grid (80 cells) cost is ~$1 total.
      frontier-llm:
        model: "openai/gpt-4o"
        price_in: 2.50
        price_out: 10.00
      large-open-llm:
        model: "anthropic/claude-haiku-4.5"
        price_in: 1.00
        price_out: 5.00
      # Paid Phi/Mistral exist but need credit; phi4-mini & mistral run on Ollama:
      #   phi4-mini: {model: microsoft/phi-4-mini-instruct, price_in: 0.08, price_out: 0.35}
      #   mistral:   {model: mistralai/ministral-8b-2512,   price_in: 0.15, price_out: 0.15}

# Cost table is interpreted as USD per 1,000,000 tokens.
prices_per_1m_tokens: true

# ----------------------------------------------------------------------------
# Run controls
# ----------------------------------------------------------------------------
run:
  pilot_docs: 3
  pilot_models: [smollm2-360m, frontier-llm]
  retry_attempts: 3
  retry_backoff_s: 2

