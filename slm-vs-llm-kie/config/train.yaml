# =============================================================================
# Phase-3 QLoRA fine-tuning config.
#
# Consumed by:
#   scripts/make_train_data.py        (data build — CPU, local, reads `data:`)
#   notebooks/03_qlora_finetune.ipynb (training — Kaggle T4x2, reads the rest)
#
# The eval-side single source of truth is still config/config.yaml. This file
# holds ONLY training-specific knobs; the data builder pulls
# `conditions.max_input_lines` / `conditions.input_variants` from config.yaml so
# prompts stay identical to eval — do not duplicate those here.
# =============================================================================

# SFT data build (scripts/make_train_data.py) --------------------------------
data:
  out_path: data/train/sft.jsonl
  datasets: [sroie, kleister_charity]
  # Cap records per dataset. Run 2 (stronger config) lifts the cap to use ALL
  # train docs (sroie 501 + kleister 1729 = 2230; ~4460 examples at 2 variants).
  # null = all. Was 400 for the first round-trip.
  max_per_dataset: null

# Base models to fine-tune ---------------------------------------------------
# Start with phi4-mini only (prove the round-trip), then uncomment mistral.
# `ollama_tag` is the NEW tag the GGUF is imported as, matching config.yaml.
models:
  phi4-mini-ft:
    base_repo: "unsloth/Phi-4-mini-instruct"   # Unsloth 4-bit-ready checkpoint
    base_ollama: phi4-mini                      # baseline tag (for the Modelfile template)
    ollama_tag: phi4-mini-ft
  # mistral-7b-ft:
  #   base_repo: "unsloth/mistral-7b-instruct-v0.3-bnb-4bit"
  #   base_ollama: mistral
  #   ollama_tag: mistral-7b-ft

# LoRA / QLoRA adapter --------------------------------------------------------
lora:
  r: 64                  # Run 2: 16 -> 64 for more adapter capacity.
  alpha: 64              # alpha = r keeps merge scaling = 1.0.
  dropout: 0.0            # Unsloth-optimized path prefers 0.0
  bias: none
  # Phi-3/Phi-4-mini FUSE attention into qkv_proj and MLP into gate_up_proj.
  # Run 1 used the unfused names [q_proj,k_proj,v_proj,gate_proj,up_proj,...] which
  # matched NOTHING for those five (only o_proj + down_proj got adapters -> weak gain).
  # These fused names cover all attention + MLP projections.
  target_modules: [qkv_proj, o_proj, gate_up_proj, down_proj]
  use_gradient_checkpointing: unsloth

# SFT trainer hyperparameters ------------------------------------------------
sft:
  max_seq_len: 4096       # >= longest (prompt+completion). Kleister p99≈3.1k tok, max≈3.4k;
                          # 2048 truncated the response off ~41% of Kleister docs (labels
                          # all -100 -> silently dropped). 4096 keeps 100% of examples.
  load_in_4bit: true
  epochs: 5               # Run 2: 3 -> 5
  learning_rate: 2.0e-4
  lr_scheduler: linear
  warmup_ratio: 0.03
  per_device_batch_size: 2
  grad_accum_steps: 4     # effective batch 8
  weight_decay: 0.01
  optim: adamw_8bit
  seed: 42                # matches config.yaml seed for reproducibility
  train_on_responses_only: true   # mask the prompt; learn only the JSON completion

# GGUF export (-> Ollama) ----------------------------------------------------
export:
  quants: [q4_k_m, q8_0]  # q4_k_m is the one registered in config.yaml
  out_dir: artifacts      # notebook writes GGUF + Modelfile + zip here
